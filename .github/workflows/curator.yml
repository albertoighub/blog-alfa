name: Ejecutor Periodistico TEP

on:
  schedule:
    # Se ejecuta de forma autonoma cada 4 horas
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  curar-y-publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerias del motor
        run: |
          pip install feedparser python-slugify google-genai

      - name: Ejecutar motor editorial y despacho a Telegram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          python curator_engine.py

      - name: Sincronizar articulos generados con el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/blog/ history.json
          if git diff --staged --quiet; then
            echo "Sin publicaciones nuevas en este ciclo."
          else
            git commit -m "chore(auto): curaduria editorial TEP [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
