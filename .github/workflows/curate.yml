name: Ejecutor Periodistico TEP

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  curar_noticias:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Repositorio
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependencias de Motor
        run: |
          pip install feedparser python-slugify google-genai

      - name: Ejecutar Motor Analitico TEP
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python curator_engine.py

      - name: Sincronizar y Publicar
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/blog/*.md history.json
          if git diff --staged --quiet; then
            echo "No hay noticias nuevas para publicar."
          else
            git commit -m "🤖 [TEP-AI] Nuevos Papers Cientificos Publicados"
            git pull --rebase origin main
            git push origin main
          fi